withdraw_default:
  id: withdraw_default
  group: withdraw
  label: 'Withdraw Default'
  states:
    draft:
      label: 'Draft'
    approved:
      label: 'Approved'
    rejected:
      label: 'Rejected'
    processing:
      label: 'Processing'
    failed:
      label: 'Failed'
    completed:
      label: 'Completed'
    canceled:
      label: 'Canceled'
  transitions:
    approve:
      label: 'Approve'
      from: [draft]
      to: approved
    reject:
      label: 'Reject'
      from: [draft]
      to: rejected
    transfer:
      label: 'Transfer'
      from: [approved]
      to: processing
    fails:
      label: 'Fails'
      from: [processing]
      to: failed
    retry:
      label: 'Retry'
      from: [failed]
      to: processing
    complete:
      label: 'Complete'
      from: [processing]
      to: completed
    cancel:
      label: 'Cancel'
      from: [draft, failed]
      to: canceled
